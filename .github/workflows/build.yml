name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-watch-fs

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifact
          path: build/libs
